version: 2
builds:
  # The SQLite driver is pure Go, so one entry builds both architectures
  # statically and nothing here needs a C toolchain.
  - id: oberwatch-linux
    main: ./cmd/oberwatch
    binary: oberwatch
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version=v{{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.built={{.Date}}

archives:
  - id: default
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
